name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          docker build -t mtls-hello-build-debian -f docker/Dockerfile.debian .
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -v mtls-dub-deb:/root/.dub mtls-hello-build-debian

      - name: Build Arch package
        run: |
          docker build -t mtls-hello-build-arch -f docker/Dockerfile.arch .
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -v mtls-dub-arch:/root/.dub mtls-hello-build-arch

      - name: Set version
        id: version
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' dub.json | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb=mtls-hello_${VERSION}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "pkg=mtls-hello-${VERSION}-1-x86_64.pkg.tar.zst" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "mtls-hello ${{ steps.version.outputs.version }}"
          files: |
            dist/${{ steps.version.outputs.deb }}
            dist/${{ steps.version.outputs.pkg }}
          generate_release_notes: true
