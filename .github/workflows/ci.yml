name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian base image (shared with package jobs)
        run: docker build -t mtls-hello-build-debian -f docker/Dockerfile.debian .

      - name: Build test image (+ bats, curl, git)
        run: docker build -t mtls-hello-test -f docker/Dockerfile.test .

      - name: Build binary and run tests
        run: |
          docker run --rm mtls-hello-test bash -c '
            cp -a /src /build && cd /build && rm -rf .dub
            DC=ldc2 dub build --compiler=ldc2
            bats tests/
          '

  package-debian:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian package
        run: |
          docker build -t mtls-hello-build-debian -f docker/Dockerfile.debian .
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -v mtls-dub-deb:/root/.dub mtls-hello-build-debian

      - name: Verify .deb
        run: |
          dpkg-deb -I dist/mtls-hello_*.deb
          dpkg-deb -c dist/mtls-hello_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/mtls-hello_*.deb

  package-arch:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Arch package
        run: |
          docker build -t mtls-hello-build-arch -f docker/Dockerfile.arch .
          mkdir -p dist
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/out" \
            -v mtls-dub-arch:/root/.dub mtls-hello-build-arch

      - name: Verify .pkg
        run: |
          tar -I zstd -tf dist/mtls-hello-*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/mtls-hello-*.pkg.tar.zst
